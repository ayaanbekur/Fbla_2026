<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your School - Lost & Found</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        .school-selection {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--background) 0%, var(--surface) 100%);
            padding: 2rem;
        }

        .school-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
            border: 2px solid var(--border);
        }

        .school-card h1 {
            color: var(--text);
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .school-card p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .school-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .school-option {
            background: var(--background);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text);
            display: block;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
        }

        .school-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border-color: var(--primary);
            background: var(--surface);
        }

        .school-option.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .continue-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            display: block;
        }

        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(200, 16, 46, 0.3);
        }

        .continue-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 768px) {
            .school-grid {
                grid-template-columns: 1fr;
            }

            .school-card {
                padding: 2rem;
                margin: 1rem;
            }

            .school-card h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="school-selection">
        <div class="school-card">
            <h1>Welcome to Lost & Found</h1>
            <p>Please select your Forsyth County high school to continue:</p>

            <form id="school-form" method="POST" action="{{ url_for('set_school') }}">
                <div class="school-grid">
                    <div class="school-option" data-school="South Forsyth">South Forsyth</div>
                    <div class="school-option" data-school="North Forsyth">North Forsyth</div>
                    <div class="school-option" data-school="West Forsyth">West Forsyth</div>
                    <div class="school-option" data-school="East Forsyth">East Forsyth</div>
                    <div class="school-option" data-school="Forsyth Central">Forsyth Central</div>
                    <div class="school-option" data-school="Lambert">Lambert</div>
                    <div class="school-option" data-school="Denmark">Denmark</div>
                    <div class="school-option" data-school="Alliance">Alliance</div>
                </div>

                <input type="hidden" name="school" id="selected-school" required>
                <button type="submit" class="continue-btn" id="continue-btn" disabled>Continue</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const schoolOptions = document.querySelectorAll('.school-option');
            const selectedSchoolInput = document.getElementById('selected-school');
            const continueBtn = document.getElementById('continue-btn');
            let selectedSchool = null;

            schoolOptions.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove selected class from all options
                    schoolOptions.forEach(opt => opt.classList.remove('selected'));

                    // Add selected class to clicked option
                    this.classList.add('selected');

                    // Update hidden input and enable button
                    selectedSchool = this.dataset.school;
                    selectedSchoolInput.value = selectedSchool;
                    continueBtn.disabled = false;
                });
            });
        });
    </script>
</body>
</html>
