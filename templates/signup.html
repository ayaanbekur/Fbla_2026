{% extends "base.html" %}

{% block content %}
<div class="form-container fade-in">
    <h2>Create Account</h2>
    <form method="POST">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <select name="school" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--background); color: var(--text); font-size: 1rem; margin-bottom: 1rem;">
            <option value="">Select Your School</option>
            <option value="South Forsyth">South Forsyth</option>
            <option value="North Forsyth">North Forsyth</option>
            <option value="West Forsyth">West Forsyth</option>
            <option value="East Forsyth">East Forsyth</option>
            <option value="Forsyth Central">Forsyth Central</option>
            <option value="Lambert">Lambert</option>
            <option value="Denmark">Denmark</option>
            <option value="Alliance">Alliance</option>
        </select>
        <button type="submit" class="cta-button">Sign Up</button>
    </form>
    <p style="margin-top:1rem;">Already have an account?
        <a href="{{ url_for('login') }}" style="color:#e63946; font-weight:bold;">Login</a>
    </p>
</div>
{% endblock %}
